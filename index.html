<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Life Dashboard – 节假日增强动效版</title>
<meta name="description" content="Life Dashboard – Visual Time Calculator by sosong">
<style>
:root {
  --c-blue:#007bff; --c-cyan:#00c6ff;
  --c-green:#28c76f; --c-orange:#ff9f43;
  --glass: rgba(255,255,255,.85);
}
*{box-sizing:border-box}
body{
  margin:0;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:linear-gradient(135deg,#eaf6ff,#f6fffa);color:#1f2937;
}
.container{
  max-width:900px;margin:50px auto 100px;padding:40px;background:var(--glass);
  backdrop-filter:blur(12px);border-radius:20px;box-shadow:0 10px 30px rgba(0,80,160,.12);
  position:relative;overflow:hidden;
}
.blobs{position:absolute;inset:-20%;z-index:-1;filter:blur(40px);opacity:.6}
.blob{position:absolute;width:40vmax;height:40vmax;border-radius:50%;animation:float 18s ease-in-out infinite}
.blob:nth-child(1){background:radial-gradient(circle at 30% 30%,#87d7ff,#4ec7ff 40%,#00b7ff 70%,transparent 72%)}
.blob:nth-child(2){right:-10%;top:10%;background:radial-gradient(circle at 70% 60%,#96f4df,#4be3c7 40%,#20c997 70%,transparent 72%);animation-duration:22s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3%)}}
h1{
  font-size:clamp(26px,3vw,34px);font-weight:800;
  background:linear-gradient(90deg,var(--c-blue),var(--c-cyan));
  -webkit-background-clip:text;background-clip:text;color:transparent;text-align:center;margin:0 0 8px
}
.sub{color:#555;text-align:center;margin:0 0 28px}
.section{margin-top:22px;padding:16px;border-radius:14px;background:rgba(255,255,255,.65);border:1px solid rgba(0,0,0,.05)}
.section-title{font-weight:800;color:var(--c-blue);margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.input{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:10px 12px}
.input label{flex:0 0 40%;text-align:right;font-weight:700;color:#374151;font-size:14px}
.input input,.input select{flex:1;border:1px solid #e5e7eb;border-radius:8px;padding:10px;font-size:15px;text-align:center}
.input input:focus,.input select:focus{outline:none;border-color:var(--c-blue);box-shadow:0 0 0 4px rgba(0,123,255,.15)}
.actions{display:flex;gap:12px;margin-top:18px}
.btn{
  flex:1;position:relative;overflow:hidden;border:none;border-radius:10px;padding:14px;color:#fff;
  cursor:pointer;font-size:16px;font-weight:800;transition:.2s;box-shadow:0 8px 24px rgba(0,123,255,.25)
}
.btn.primary{background:linear-gradient(90deg,#007bff,#00c6ff)}
.btn.secondary{background:linear-gradient(90deg,#28a745,#20c997)}
.btn:hover{transform:translateY(-1px)}
.ripple{position:absolute;border-radius:50%;transform:scale(0);background:rgba(255,255,255,.4);animation:ripple .6s linear}
@keyframes ripple{to{transform:scale(6);opacity:0}}
.card{
  margin-top:26px;padding:22px;border-radius:16px;background:rgba(250,250,255,.9);
  border:1px solid rgba(0,0,0,.06);box-shadow:inset 0 0 18px rgba(0,0,0,.05);
  opacity:0;transform:translateY(10px);animation:pop .6s .1s ease forwards
}
@keyframes pop{to{opacity:1;transform:translateY(0)}}
.card h3{text-align:center;color:var(--c-blue);margin:0 0 10px}
.canvas-wrap{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:18px}
#donut{width:220px;height:220px}
.progress-box{min-width:300px;background:rgba(245,250,255,.7);border-radius:14px;padding:12px;border:1px dashed rgba(0,123,255,.25)}
.progress-label{display:flex;justify-content:space-between;font-size:13px;color:#475569}
.grains{display:grid;grid-template-columns:repeat(90,1fr);gap:3px;height:18px}
.grain{border-radius:8px;opacity:0;animation:rise .5s ease forwards, shimmer 2.4s ease-in-out infinite}
@keyframes rise{to{opacity:1}}
@keyframes shimmer{0%,100%{filter:brightness(1)}50%{filter:brightness(1.25)}}
.g-free{background:linear-gradient(180deg,#34eb83,#20d07a)}
.g-sleep{background:linear-gradient(180deg,#5bc0de,#007bff)}
.g-work{background:linear-gradient(180deg,#ffb25e,#ff7b00)}
.kpis{margin-top:10px}
.kpis .row{display:flex;justify-content:space-between;border-bottom:1px dashed #cfe4ff;padding:8px 0}
.kpis .row strong{font-weight:800}
.kpis .row .bad{color:#dc3545}
footer{text-align:center;color:rgba(0,0,0,.45);font-size:13px;margin-top:20px}
@media (max-width:520px){.input label{text-align:left}}
</style>
</head>
<body>
<div class="container" id="app">
  <div class="blobs"><div class="blob"></div><div class="blob"></div></div>

  <h1>💫 Life Dashboard</h1>
  <p class="sub">分析你的 <b>自由</b>、<b>睡眠</b>、<b>工作</b> 时间比例，并可视化人生节奏。</p>

  <div class="section">
    <div class="section-title">👤 基本信息</div>
    <div class="grid">
      <div class="input"><label>🎂 生日</label><input id="birthDate" type="date" value="1994-04-19"></div>
      <div class="input"><label>👴 期望寿命(岁)</label><input id="lifespan" type="number" value="80" min="1" max="120"></div>
      <div class="input"><label>💼 退休年龄(岁)</label><input id="retireAge" type="number" value="65" min="1" max="100"></div>
      <div class="input"><label>🗓️ 每周休息天数</label>
        <select id="restDays">
          <option value="2" selected>2 天(双休)</option>
          <option value="1">1 天</option>
          <option value="3">3 天</option>
        </select>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">🕒 作息参数</div>
    <div class="grid">
      <div class="input"><label>😴 睡眠(小时/天)</label><input id="sleepH" type="number" value="8" min="0" max="24"></div>
      <div class="input"><label>💻 工作(小时/天)</label><input id="workH" type="number" value="8.5" step="0.5" min="0" max="24"></div>
      <div class="input"><label>🚗 通勤(小时/天)</label><input id="commuteH" type="number" value="1.5" step="0.5" min="0" max="24"></div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">🧧 法定节假日设置</div>
    <div class="grid">
      <div class="input"><label>元旦</label><input type="number" id="h_yuandan" value="1" min="0" max="7"></div>
      <div class="input"><label>春节</label><input type="number" id="h_chunjie" value="4" min="0" max="10"></div>
      <div class="input"><label>清明</label><input type="number" id="h_qingming" value="1" min="0" max="7"></div>
      <div class="input"><label>劳动节</label><input type="number" id="h_laodong" value="2" min="0" max="7"></div>
      <div class="input"><label>端午</label><input type="number" id="h_duanwu" value="1" min="0" max="7"></div>
      <div class="input"><label>中秋</label><input type="number" id="h_zhongqiu" value="1" min="0" max="7"></div>
      <div class="input"><label>国庆</label><input type="number" id="h_guoqing" value="3" min="0" max="10"></div>
    </div>
    <p style="text-align:right;color:#007bff;font-weight:700;margin:8px 4px 0;">
      全年法定节假日合计：<span id="holidaySum">13</span> 天
    </p>
    <div class="actions">
      <button class="btn primary" id="calcBtn">🎯 计算人生时间</button>
      <button class="btn secondary" id="exportBtn">📸 导出 PNG</button>
    </div>
  </div>

  <div class="card" id="result" style="display:none;">
    <h3>📊 时间分布可视化</h3>
    <div class="canvas-wrap">
      <canvas id="donut" width="220" height="220"></canvas>
      <div class="progress-box">
        <div class="progress-label"><span>🧘 自由</span><span>😴 睡眠</span><span>💼 工作</span></div>
        <div class="grains" id="grains"></div>
      </div>
    </div>
    <div class="kpis">
      <div class="row"><span>🧘 自由清醒时间</span><strong id="freeText">—</strong></div>
      <div class="row"><span>😴 睡眠时间</span><strong id="sleepText">—</strong></div>
      <div class="row"><span>💼 工作/通勤时间</span><strong class="bad" id="busyText">—</strong></div>
    </div>
  </div>
</div>

<footer>Designed by sosong</footer>

<!-- 先加载 html2canvas（导出所需），失败也不影响“计算”按钮 -->
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" defer></script>
<script>
/* ======= 常量与小工具 ======= */
const DAYS=365.25, MS=86400000;
const $ = id => document.getElementById(id);
function ripple(e){
  const b=e.currentTarget, s=document.createElement('span');
  s.className='ripple';
  const d=Math.max(b.clientWidth,b.clientHeight);
  s.style.width=s.style.height=d+'px';
  const rect=b.getBoundingClientRect();
  s.style.left=(e.clientX-rect.left-d/2)+'px';
  s.style.top=(e.clientY-rect.top-d/2)+'px';
  b.appendChild(s); setTimeout(()=>s.remove(),600);
}
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function formatHours(h){const y=h/(24*DAYS);return `${Math.round(h).toLocaleString()} 小时（≈ ${y.toFixed(2)} 年）`;}
function animateNumber(el,target,fmt,dur=900){
  const t0=performance.now();
  function step(now){
    const p=Math.min(1,(now-t0)/dur), v=lerp(0,target,ease(p));
    el.textContent = fmt?fmt(v):Math.round(v).toLocaleString();
    if(p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* ======= 计算核心 ======= */
function sumHolidays(){
  const ids=["h_yuandan","h_chunjie","h_qingming","h_laodong","h_duanwu","h_zhongqiu","h_guoqing"];
  const total = ids.map(id=>parseFloat($(id).value)||0).reduce((a,b)=>a+b,0);
  $("holidaySum").textContent = total;
  return total;
}
document.querySelectorAll('[id^="h_"]').forEach(el=>el.addEventListener('input', sumHolidays));

function calculate(){
  const birth=new Date($("birthDate").value);
  const lifespan=+$("lifespan").value;
  const retire=+$("retireAge").value;
  const restDays=+$("restDays").value;
  const sleepH=+$("sleepH").value;
  const workH=+$("workH").value;
  const commuteH=+$("commuteH").value;
  const holiday = sumHolidays();

  if(sleepH+workH+commuteH>24){ alert("作息总时间超过 24 小时！"); return; }

  const today=new Date(); today.setHours(0,0,0,0);
  const retireDate=new Date(birth); retireDate.setFullYear(birth.getFullYear()+retire);
  const endDate=new Date(birth); endDate.setFullYear(birth.getFullYear()+lifespan);

  const totalDays=Math.max(0, Math.ceil((endDate - today)/MS));
  const workPeriod = today < retireDate ? Math.ceil((retireDate - today)/MS) : 0;
  const retirePeriod = totalDays - workPeriod;

  const weekend = DAYS*(restDays/7);
  const workNoHoliday = DAYS - weekend;
  const netHoliday = holiday * (workNoHoliday/DAYS);
  const restDaysPerY = weekend + netHoliday;
  const workDaysPerY = DAYS - restDaysPerY;
  const wr = workDaysPerY/DAYS, rr = restDaysPerY/DAYS;

  const workDayFree=24 - (workH+commuteH) - sleepH;
  const restDayFree=24 - sleepH;

  const workDays = workPeriod * wr;
  const restDaysCount = workPeriod * rr;

  const freeH = workDays*workDayFree + restDaysCount*restDayFree + retirePeriod*restDayFree;
  const sleepTotal = totalDays * sleepH;
  const busyH = workDays * (workH+commuteH);

  const sum = freeH + sleepTotal + busyH;
  const ratio = [freeH/sum, sleepTotal/sum, busyH/sum];

  drawDonutAnimated($("donut"), ratio, ["#34eb83","#5bc0de","#ff9f43"]);
  renderGrains($("grains"), ratio);
  animateNumber($("freeText"), freeH, formatHours, 1000);
  animateNumber($("sleepText"), sleepTotal, formatHours, 1000);
  animateNumber($("busyText"), busyH, formatHours, 1000);

  $("result").style.display = "block";
}

/* ======= 圆环与颗粒条 ======= */
function drawDonutAnimated(canvas, ratios, colors, duration=1000){
  const ctx=canvas.getContext('2d'), W=canvas.width, H=canvas.height;
  const cx=W/2, cy=H/2, r=W/2-20, lw=28, total=Math.PI*2;
  const t0=performance.now();
  function frame(now){
    const p=Math.min(1,(now-t0)/duration), e=ease(p);
    ctx.clearRect(0,0,W,H);
    ctx.globalAlpha=.12; ctx.lineWidth=lw; ctx.strokeStyle="#000";
    ctx.beginPath(); ctx.arc(cx,cy,r,-Math.PI/2, 1.5*Math.PI); ctx.stroke(); ctx.globalAlpha=1;

    let start=-Math.PI/2;
    for(let i=0;i<3;i++){
      const seg = total*ratios[i];
      const end = start + seg*e;
      ctx.strokeStyle=colors[i]; ctx.lineCap="round"; ctx.lineWidth=lw;
      ctx.beginPath(); ctx.arc(cx,cy,r,start,end); ctx.stroke();
      start += seg; // 下段从完整位置开始
    }
    ctx.fillStyle="#1f2937"; ctx.font="700 18px system-ui"; ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText(Math.round(ratios[0]*100)+"% 自由", cx, cy);
    if(p<1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
function renderGrains(container, ratios){
  const total=90;
  const free=Math.round(total*ratios[0]);
  const sleep=Math.round(total*ratios[1]);
  container.innerHTML="";
  for(let i=0;i<total;i++){
    const g=document.createElement('div'); g.className='grain';
    if(i<free) g.classList.add('g-free');
    else if(i<free+sleep) g.classList.add('g-sleep');
    else g.classList.add('g-work');
    g.style.animationDelay=(i/45 + Math.random()*0.15)+'s';
    container.appendChild(g);
  }
}

/* ======= 事件绑定（确保不报错） ======= */
$("calcBtn").addEventListener("click", e => { ripple(e); setTimeout(calculate, 120); });

$("exportBtn").addEventListener("click", e => {
  ripple(e);
  // html2canvas 可能尚未加载完成，做个判定；加载失败也不影响“计算”功能
  const doExport = () => {
    html2canvas(document.querySelector(".container")).then(canvas=>{
      const a=document.createElement("a");
      a.href=canvas.toDataURL("image/png");
      a.download="life-dashboard.png";
      document.body.appendChild(a);
      a.click(); a.remove();
    }).catch(err=>{
      console.error(err);
      alert("导出失败：可能浏览器阻止了截图，或第三方脚本未加载。");
    });
  };
  if(typeof html2canvas==="undefined"){
    const s=document.createElement("script");
    s.src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js";
    s.onload=doExport; document.body.appendChild(s);
  }else{
    doExport();
  }
});

/* ======= 初始渲染 ======= */
window.addEventListener('load', () => { sumHolidays(); calculate(); });
</script>
</body>
</html>
